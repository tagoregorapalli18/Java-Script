<!DOCTYPE html>
<html>
	<head>
	<title>MAP_FILTER_REDUCE</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	
	</head>
	
	<body>
	
	<script>
	//map()
	  const a=[
			{name:"abc",marks:99,},
			{name:"xyz",marks:89,},
			]
	const s1=a.map(user=>"hello"+user.name);
	console.log(s1);
	
	//filter()
	const b=[1,2,3,4,5,6,7,8];
	const s3=b.filter(u1=>{ return u1%2===0});
	console.log(s3);
	
	//reduce()
	     const arr=[1,2,3,4,5,6];
		 const sum=arr.reduce((acc,num)=> acc+num,0);
		 console.log(sum);
	</script>
	</body>
</html>
