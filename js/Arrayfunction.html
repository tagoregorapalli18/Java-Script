<!DOCTYPE html>
<html>
	<head>
	<title>ARRAYFUNCTION</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	</head>
	<body>
	<script>
	//Array
	let array=[10,20,30];
	console.log(array);
	//push()
	let array1=[10,20,30];
	array1.push(40);
	console.log(array1);
	//pop()
	let array2=[10,20,30];
	array2.pop();
	console.log(array2);
	//shift()
	let array3=[10,20,30];
	array3.shift();
	console.log(array3);
	//unshift()
	let array4=[10,20,30];
	array4.unshift(5);
	console.log(array4);
	//sort()  not numerical
	let array5=[10,20,30,8,9,14,100,56];
	array5.sort();
	console.log(array5);
	
	//sort()  correct
	let array6=[10,20,30,8,9,14,100,56];
	array6.sort((a,b) => a-b);
	console.log(array6);
	</script>
	</body>
</html>
