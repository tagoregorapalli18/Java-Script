<!DOCTYPE html>
<html>
<head>
	<title>Mouseover&out</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container-fluid">
	<div class="row">
		<div class="col-md-1">
			<div class="card">
				<div class="card-body">
					<img  src="./king.jpg" alt="image"  width=100% onmouseover="disp(this)" onmouseout="act()">
				</div>
			</div>
			<div class="card">
				<div class="card-body">
					<img src="./king1.png" alt="image"  width=100% onmouseover="disp(this)" onmouseout="act()"> 
				</div>
			</div>
			<div class="card">
				<div class="card-body">
					<img src="./heaven.jpg" alt="image"  width=100% onmouseover="disp(this)" onmouseout="act() "> 
				</div>
			</div>
		</div>
		<div class="col-md-5">
			<img src="./king.jpg" alt="image" id="img1" width=100%>
		</div>
		<div>
			
		</div>
	</div>
  </div>
<script>
    function disp(newimg){
	document.getElementById("img1").src=newimg.src;
	}
	function act(){
	document.getElementById("img1").src="./king.jpg";
	}
</script>
</body>
</html>
