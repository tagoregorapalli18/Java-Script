<!DOCTYPE html>
<html>
	<head>
	<title>FOR_FORIN_FOROF</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	
	</head>
	
	<body>
	
	<script>
	//for
	const a=['a','b','c','d'];
	for(i=0;i<a.length;i++){
	console.log(a[i]);
	}
	//for in
	const a1={ui:'html',db:'sql',be:'sb'};
	for(let i1 in a1){
	console.log(a1[i1]);
	console.log(Object.entries(i1));
	console.log(Object.keys(i1));
	console.log(Object.values(i1));
	}
	//for..of
	let fruits=['a','b','c'];
	for(let t of fruits){
	console.log(t);
	}
	</script>
	</body>
</html>
