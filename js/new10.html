<!DOCTYPE html>
<html>
	<head>
	<title>EVENTBUBBLING</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
	.div1{
	width:500px;
	height:500px;
	background-color:red;
	}
	.div2{
	width:350px;
	height:350px;
	background-color:blue;
	}
	.div3{
	width:150px;
	height:150px;
	background-color:green;
	}
	
	</style>
	</head>
	<body>
	<div type="name" class="div1" id="div1">
		<div type="name" class="div2" id="div2">
			<div type="name" class="div3" id="div3">
				<button type="button"  id="btn1"> click </button>
			</div>
		</div>
	</div>
	<script>
	 document.getElementById("btn1").addEventListener('click',() =>{console.log("button clicked");event.stopPropagation();}); 
	 document.getElementById("div1").addEventListener('click',() =>{console.log(" div1 button clicked");event.stopPropagation();}); 
	 document.getElementById("div2").addEventListener('click',() =>{console.log("div2 clicked");event.stopPropagation();}); 
	 document.getElementById("div3").addEventListener('click',() =>{console.log("div3 clicked");event.stopPropagation();}); 
	</script>
	</body>
</html>
