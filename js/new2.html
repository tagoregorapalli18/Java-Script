<!DOCTYPE html>
<html>
<head>
	<title>JAVASCRIPT</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
   <div class="container-fluid">
		<div class="row">
			<div class="col-md-12">
				<form name="registration" method="post" onsubmit="return verify()" action="./new1.html">
				<input type="text" name="firstname" id="firstname" placeholder="FIRSTNAME">
				<label id="info" > </label>
				<input type="text" name="lastname" id="lastname" placeholder="LASTNAME">
				<input type="text" name="username" id="username" placeholder="USERNAME">
				<input type="text" name="password" id="password" placeholder="password">
				<button type="submit">submit</button>
				</form>
			</div>
		</div>
   </div>
<script>
    document.getElementById("firstname").addEventListener("keypress",onlychars);
	function onlychars(event){
	var ch=event.which;
	if(!((ch>=65 && ch<=90) || (ch>=97 && ch<=122) || (ch==32) || (ch==8))){
     event.preventDefault();}
	}
	
	function verify(){
		let firstname=document.getElementById("firstname").value;
		if((firstname.length)<3){
		document.getElementById("info").innerHTML="first name must be 3 or more characters";
		document.getElementById("info").style.color="red";
		return false;
		}
		}
	
</script>
</body>
</html>
